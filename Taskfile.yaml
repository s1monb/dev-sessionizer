version: "3"

tasks:
  install:
    desc: Install everything on the local machine within .config-folder
    cmds:
      - '[ -f .gitmodules ] && git submodule update --init --recursive || true'
      - rm -rf $HOME/.config/tmux $HOME/.config/nvim $HOME/.config/bin $HOME/.config/oh-my-bash $HOME/.config/k9s $HOME/.config/ai
      - cp -r ./env/vendor/oh-my-bash $HOME/.config/oh-my-bash
      - rm -f $HOME/.config/oh-my-bash/.git
      - cp -r ./env/.config/oh-my-bash/custom/. $HOME/.config/oh-my-bash/custom/
      - cp -r ./env/.config/tmux $HOME/.config/tmux
      - cp -r ./env/.config/nvim $HOME/.config/nvim
      - cp -r ./env/.config/bin $HOME/.config/bin
      - cp -r ./env/.config/k9s $HOME/.config/k9s
      - cp -r ./env/.config/ai $HOME/.config/ai
      - mkdir -p $HOME/.config/bash
      - cp ./env/.config/bash/dev-sessionizer.bash $HOME/.config/bash/dev-sessionizer.bash
      - test -f $HOME/.bashrc || cp ./env/.bashrc.example $HOME/.bashrc
      - mkdir -p $HOME/.config/bash/completions
      - 'command -v flux >/dev/null 2>&1 && flux completion bash > $HOME/.config/bash/completions/flux.bash || true'
      - 'command -v talosctl >/dev/null 2>&1 && talosctl completion bash > $HOME/.config/bash/completions/talosctl.bash || true'
      - 'command -v go-task >/dev/null 2>&1 && go-task --completion bash > $HOME/.config/bash/completions/go-task.bash || true'
      - mkdir -p $HOME/.local/share/nvim/site/pack/vendor/start
      - 'find ./env/vendor/nvim -mindepth 1 -maxdepth 1 -type d -exec cp -r {} $HOME/.local/share/nvim/site/pack/vendor/start/ \; 2>/dev/null || true'

  clean:
    desc: Clear the local nvim runtime state (treesitter, Mason, etc.)
    cmds:
      - rm -rf $HOME/.local/share/nvim
      - rm -rf $HOME/.local/state/nvim

  pack:
    desc: Pack the runtime state and cfg-files into a gzip for transport
    cmds:
      - mkdir -p ./backup
      - mkdir -p ./backup/{share,state}/{nvim}
      - test -d "$HOME/.local/state/nvim" && cp -r $HOME/.local/state/nvim ./backup/state/nvim
      - test -d "$HOME/.local/share/nvim" && cp -r $HOME/.local/share/nvim ./backup/share/nvim && rm -rf ./backup/share/nvim/site/pack/vendor
      - cp -r env                     ./backup/
      - cp Taskfile.yaml              ./backup/
      - tar -czvf backup.tar.gz       ./backup
      - rm -rf ./backup

  unpack:
    desc: Unpack the runtime state and cfg-files from a gzip archive (run from inside the extracted backup dir)
    cmds:
      - task: clean
      - task: install
      - cp -r ./state/nvim $HOME/.local/state/
      - cp -r ./share/nvim $HOME/.local/share/
